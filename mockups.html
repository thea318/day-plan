<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Healthy Day Plan Preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3eb;
        --paper: #fffdfa;
        --ink: #1f2925;
        --muted: #63706a;
        --line: rgba(37, 48, 44, 0.14);
        --green: #2f6f57;
        --blue: #386fa4;
        --coral: #d96846;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
      }

      .page {
        width: min(960px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 34px 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 2.5rem;
        line-height: 1;
        letter-spacing: 0;
      }

      a {
        border-radius: 8px;
        background: var(--green);
        color: #fff;
        font-weight: 850;
        padding: 11px 14px;
        text-decoration: none;
        white-space: nowrap;
      }

      .preview {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 18px 45px rgba(39, 48, 43, 0.1);
        overflow: hidden;
      }

      .bar {
        height: 12px;
        background: linear-gradient(90deg, var(--green), var(--blue), var(--coral));
      }

      .content {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        padding: 18px;
      }

      .tile {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }

      .tile h2 {
        margin: 0 0 8px;
        font-size: 1.05rem;
      }

      .tile p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
      }

      @media (max-width: 700px) {
        header,
        .content {
          grid-template-columns: 1fr;
        }

        header {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>Healthy Day Plan Preview</h1>
        <a href="./index.html">Open App</a>
      </header>
      <section class="preview" aria-label="Project preview">
        <div class="bar"></div>
        <div class="content">
          <article class="tile">
            <h2>Meals</h2>
            <p>Breakfast, lunch, snack, and dinner option pickers.</p>
          </article>
          <article class="tile">
            <h2>Daily Habits</h2>
            <p>Water, sunlight, meals, and sleep checkboxes.</p>
          </article>
          <article class="tile">
            <h2>Rules</h2>
            <p>One planned sweet and a two-week dairy break reminder.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
